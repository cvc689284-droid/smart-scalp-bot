<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fully Automated Scalp Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <div>
        <!-- رأس التطبيق -->
        <header class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-xl font-bold text-cyan-400">البوت الآلي بالكامل 🤖</h1>
                <p class="text-xs text-slate-400">إدارة صفقات الاسكالْبينج سحابياً</p>
            </div>
            <div id="bot-badge" class="px-3 py-1 bg-rose-500/20 text-rose-400 text-xs font-semibold rounded-full border border-rose-500/30">
                متوقف
            </div>
        </header>

        <!-- إعدادات الحساب والبوت الآلي -->
        <section class="bg-slate-800/80 p-4 rounded-2xl shadow-lg mb-4 border border-slate-700">
            <h2 class="text-sm font-semibold text-slate-300 mb-3">⚙️ بيانات الربط والتشغيل (Demo)</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">رقم الحساب (Login ID)</label>
                    <input type="number" id="mt5-login" placeholder="أدخل رقم الحساب التجريبي" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">كلمة مرور التداول (Password)</label>
                    <input type="password" id="mt5-password" placeholder="كلمة المرور الخاصة بالحساب" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">سيرفر البروكر</label>
                        <input type="text" id="mt5-server" value="JustMarkets-Demo" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">حجم العقد (Lot)</label>
                        <input type="number" step="0.01" id="mt5-lot" value="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
            </div>
        </section>

        <!-- لوحة التحكم الآلي -->
        <section class="bg-slate-800/80 p-4 rounded-2xl shadow-lg border border-slate-700">
            <h2 class="text-sm font-semibold text-slate-300 mb-3">⚡ تشغيل/إيقاف التداول الذاتي</h2>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <button onclick="toggleBot('START')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-900/40 transition duration-200 text-sm">
                    تشغيل البوت 🚀
                </button>
                <button onclick="toggleBot('STOP')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-rose-900/40 transition duration-200 text-sm">
                    إيقاف البوت ⏹️
                </button>
            </div>
            <div id="bot-log" class="bg-slate-900 p-3 rounded-xl text-xs text-slate-400 h-28 overflow-y-auto border border-slate-800 font-mono">
                [النظام جاهز]: قم بإدخال بيانات الحساب واضغط تشغيل للبداء الآلي...
            </div>
        </section>
    </div>

    <!-- تذييل التطبيق -->
    <footer class="text-center text-xs text-slate-500 mt-6">
        Fully Automated Scalp Bot &copy; 2026
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function logMessage(msg) {
            const logBox = document.getElementById('bot-log');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML += `<br>[${timestamp}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function toggleBot(action) {
            const login = document.getElementById('mt5-login').value;
            const pass = document.getElementById('mt5-password').value;
            const badge = document.getElementById('bot-badge');

            if (!login || !pass) {
                alert('الرجاء إدخال رقم الحساب وكلمة المرور أولاً');
                return;
            }

            if (action === 'START') {
                badge.className = "px-3 py-1 bg-emerald-500/25 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/40 animate-pulse";
                badge.innerText = "يعمل آلياً 🟢";
                logMessage(`🚀 تم إرسال أمر تشغيل البوت للحساب ${login}. البوت الآن يتداول لوحده في الخلفية!`);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                badge.className = "px-3 py-1 bg-rose-500/20 text-rose-400 text-xs font-semibold rounded-full border border-rose-500/30";
                badge.innerText = "متوقف 🔴";
                logMessage(`⏹️ تم إيقاف المتداول الآلي بناءً على طلبك.`);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            }
        }
    </script>
</body>
</html>
